name: Security guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan tracked files for high-risk secrets
        run: node scripts/security-check.mjs
